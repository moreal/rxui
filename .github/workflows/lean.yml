name: Lean

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          use-github-cache: true
      - name: Install pinned browser test dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned Playwright Chromium
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Check formatting and shell syntax
        run: ./scripts/check_format.sh
      - name: Build library and tests
        run: lake build
      - name: Run native smoke tests
        run: lake exe leanrx_test
      - name: Run deterministic graph properties
        run: lake exe leanrx_graph_properties -- 195936478
      - name: Run native-to-JavaScript differential tests
        run: ./scripts/check_differential.sh
      - name: Check deterministic component output
        run: ./scripts/check_component_codegen.sh
      - name: Check Counter CLI orchestration
        run: ./scripts/check_cli.sh
      - name: Run component browser tests
        run: ./scripts/check_browser.sh
      - name: Run small graph benchmark smoke gate
        run: ./scripts/check_bench.sh
      - name: Run public examples
        run: ./scripts/check_examples.sh
      - name: Run compile-fail type contracts
        run: ./scripts/check_compile_fail.sh
      - name: Enforce proof placeholder policy
        run: ./scripts/check_placeholders.sh
      - name: Test the policy scanner
        run: ./scripts/test_placeholder_scanner.sh
      - name: Check reviewed axiom manifest
        run: ./scripts/check_axioms.sh
      - name: Enforce verified-path totality and safety
        run: ./scripts/check_semantic_safety.sh
