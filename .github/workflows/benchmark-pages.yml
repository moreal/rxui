name: Publish JS framework benchmark results

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          use-github-cache: true
      - name: Install pinned browser test dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned Playwright Chromium
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Run js-framework-benchmark popular-preset comparison
        run: corepack pnpm benchmark:compare -- --headless
      - name: Locate generated results table
        id: results
        run: |
          latest_result_dir="$(ls -1dt .tmp/js-framework-benchmark-results/*/ | head -n 1)"
          if [[ ! -d "${latest_result_dir}table" ]]; then
            echo "no results table found under ${latest_result_dir}" >&2
            exit 1
          fi
          echo "path=${latest_result_dir}table" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.results.outputs.path }}

  deploy:
    needs: benchmark
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
